name: CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/ci.yml'
      # Docs/protocol/topology parity is enforced by tests — docs-only
      # drift must not bypass CI (README/api-reference/api-topology/
      # protocol-compatibility are asserted against the code).
      - 'README.md'
      - 'docs/**'
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'README.md'
      - 'docs/**'
  workflow_dispatch:

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: '@0xhoneyjar'
          cache: npm
          cache-dependency-path: app/package-lock.json

      # Provenance runs BEFORE any dependency is fetched: a malicious/moved
      # GitHub ref must be rejected before install-time lifecycle scripts can
      # execute. The checker is a zero-dependency Node script, so it needs no
      # node_modules.
      - name: Dependency provenance (full-SHA pins, package.json + lockfile)
        working-directory: app
        run: node scripts/check-dependency-provenance.mjs

      - name: Install dependencies
        working-directory: app
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Typecheck
        working-directory: app
        run: npm run typecheck

      - name: Lint
        working-directory: app
        run: npm run lint

      - name: Unit tests
        working-directory: app
        run: npm run test

      - name: Build
        working-directory: app
        run: npm run build
