name: CI

on:
  # CI is a required status check on main, so its context must be created for
  # every pull request rather than being skipped by a path filter.
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'README.md'
      - 'docs/**'
      - 'deploy/**'
      - '.dockerignore'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: '@0xhoneyjar'
          cache: npm
          cache-dependency-path: app/package-lock.json

      # Provenance runs BEFORE any dependency is fetched: a malicious/moved
      # GitHub ref must be rejected before install-time lifecycle scripts can
      # execute. The checker is a zero-dependency Node script, so it needs no
      # node_modules.
      - name: Dependency provenance (full-SHA pins, package.json + lockfile)
        working-directory: app
        run: node scripts/check-dependency-provenance.mjs

      - name: Install dependencies
        working-directory: app
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Typecheck
        working-directory: app
        run: npm run typecheck

      - name: Lint
        working-directory: app
        run: npm run lint

      - name: Unit tests
        working-directory: app
        run: npm run test

      - name: Build
        working-directory: app
        run: npm run build

      - name: Build production image
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          docker build -f deploy/Dockerfile
          --secret id=node_auth_token,env=NODE_AUTH_TOKEN
          -t dixie-ci .

      - name: Smoke-test production image
        run: |
          docker run --rm --entrypoint node dixie-ci --input-type=module -e "
            import { existsSync } from 'node:fs';
            if (process.env.NODE_AUTH_TOKEN || existsSync('/root/.npmrc') || existsSync('/run/secrets/node_auth_token')) {
              throw new Error('Build credentials must not be present in the runtime image');
            }
            await import('./dist/server.js');
          "
